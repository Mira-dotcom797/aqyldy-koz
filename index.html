<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ақылды көз</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        h1 { margin-bottom: 8px; color: #38bdf8; text-align: center; font-size: 32px; }
        p.subtitle { color: #94a3b8; margin-bottom: 25px; text-align: center; font-size: 16px; }
        
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #webcam-container { 
            margin: 15px 0; 
            border: 3px solid #38bdf8; 
            border-radius: 12px; 
            overflow: hidden; 
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        #result-card {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            text-align: center;
            background-color: rgba(56, 189, 248, 0.1);
            border: 2px solid #38bdf8;
            transition: all 0.3s ease;
        }

        .result-title { font-size: 14px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        #label-container { font-size: 22px; font-weight: bold; color: #38bdf8; }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        button { 
            padding: 12px 20px; 
            font-size: 15px; 
            cursor: pointer; 
            background-color: #38bdf8; 
            color: #0f172a; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            transition: 0.3s;
        }
        button:hover { background-color: #0ea5e9; transform: translateY(-2px); }
        button:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; transform: none; }
        
        .btn-switch {
            background-color: #0284c7;
            color: #ffffff;
        }
        .btn-switch:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <h1>Ақылды көз</h1>
    <p class="subtitle">Камера арқылы айналадағы объектілерді анықтау</p>
    
    <div class="card">
        <div class="btn-group">
            <button id="btn-start" type="button" onclick="initModel()">Камераны іске қосу</button>
            <button id="btn-toggle" type="button" class="btn-switch" style="display: none;" onclick="switchCamera()">Камераны ауыстыру 🔄</button>
        </div>

        <div id="webcam-container">
            <span id="cam-placeholder" style="color: #64748b;">Камера күтілуде...</span>
        </div>

        <div id="result-card">
            <div class="result-title">Анықталған объект:</div>
            <div id="label-container">Күту режимі...</div>
        </div>
    </div>

    <script>
        const URL = "./"; 

        let model, webcam, labelContainer, maxPredictions;
        let lastSpokenText = ""; 
        let isSpeaking = false; 
        let isFacingUser = false; 
        let isRunning = false;
        let audioCtx = null; // Web Audio API контексті

        // 0.2 секундтық "бип" дыбысын шығаратын функция
        function playBeepSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine'; // Дыбыс түрі (жұмсақ синусоида)
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // 800 Гц жиілік (бип дыбысы)

                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Дыбыс қаттылығы
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); // Дыбыстың бәсеңдеуі

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2); // 0.2 секундтан кейін тоқтайды
            } catch (e) {
                console.error("Аудио ойнату қателігі:", e);
            }
        }

        // Мәтінді дауыстап оқу функциясы
        function speakText(text) {
            if ('speechSynthesis' in window) {
                if (isSpeaking || lastSpokenText === text || window.speechSynthesis.speaking) return;

                isSpeaking = true;
                lastSpokenText = text;

                // 1. Алдымен "бип" дыбысын шығарады
                playBeepSound();

                // 2. Дыбыстан кейін сөзді дауыстап оқиды
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'kk-KZ';
                    utterance.rate = 0.9; 

                    utterance.onend = () => { isSpeaking = false; };
                    utterance.onerror = () => { isSpeaking = false; };

                    window.speechSynthesis.speak(utterance);
                }, 200); // 0.2 сек кідіріс
            }
        }

        async function initModel() {
            const btn = document.getElementById("btn-start");
            btn.disabled = true;
            btn.innerText = "Модель жүктелуде...";

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                await setupWebcam(isFacingUser);

                btn.style.display = "none";
                document.getElementById("btn-toggle").style.display = "inline-block";
                isRunning = true;
                window.requestAnimationFrame(loop);
            } catch (error) {
                alertalert("Қате: " + (error?.name "Error") + "\n" + (error?.message String(error)));
                btn.disabled = false;
                btn.innerText = "Қайта көру";
                console.error(error);
            }
        }

        async function setupWebcam(flip) {
            if (webcam) {
                await webcam.stop();
            }
            webcam = new tmImage.Webcam(320, 320, flip); 
            await webcam.setup({ facingMode: flip ? "user" : "environment" }); 
            await webcam.play();

            const webcamContainer = document.getElementById("webcam-container");
            document.getElementById("cam-placeholder").style.display = "none";
            webcamContainer.innerHTML = "";
            webcamContainer.appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
        }

        async function switchCamera() {
            isFacingUser = !isFacingUser;
            const toggleBtn = document.getElementById("btn-toggle");
            toggleBtn.disabled = true;
            toggleBtn.innerText = "Ауысуда...";

            await setupWebcam(isFacingUser);

            toggleBtn.disabled = false;
            toggleBtn.innerText = "Камераны ауыстыру 🔄";
        }

        async function loop() {
            if (isRunning) {
                webcam.update();
                await predict();
                window.requestAnimationFrame(loop);
            }
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            let highestProb = 0;
            let bestClassName = "";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClassName = prediction[i].className;
                }
            }

            if (highestProb > 0.70) {
                const percent = Math.round(highestProb * 100);
                const classNameClean = bestClassName.toLowerCase().trim();

                let textToDisplay = bestClassName;

                if (classNameClean.includes("қоқыс шелегі")) {
                    textToDisplay = "Абайлаңыз!!! қоқыс шелегі";
                } else if (classNameClean.includes("байланыс кабелі")) {
                    textToDisplay = "Абайлаңыз!!! байланыс кабелі";
                } else if (classNameClean.includes("баспалдақ")) {
                    textToDisplay = "Абайлаңыз!!! баспалдақ";
                }

                labelContainer.innerText = `${textToDisplay} (${percent}%)`;
                speakText(textToDisplay);
            } else {
                labelContainer.innerText = "Анықталмады...";
                lastSpokenText = ""; 
            }
        }
    </script>
</body>
</html>
